  const drawAcc = () => {
    const a = $('#acc', b), has = !!p.user_id;
    a.innerHTML = `<div class="accrow"><span class="accdot ${has ? 'on' : ''}"></span><span class="amain"><b>${has ? tx('Zugang aktiv','Login active') : tx('Noch kein Zugang','No login yet')}</b><small>${has ? esc(p.email || '') : tx('Lege einen Zugang an, damit sich der Spieler anmelden kann.','Create a login so the player can sign in.')}</small></span></div>
      <div class="accbtns">${has ? `<button class="btn ghost" id="apw">${tx('Neues Passwort festlegen','Set new password')}</button>` : `<button class="btn gold" id="acreate">${tx('Zugang erstellen','Create login')}</button>`}</div>`;
    const cr = $('#acreate', a); if(cr) cr.onclick = () => pwSheet('create');
    const pw2 = $('#apw', a); if(pw2) pw2.onclick = () => pwSheet('reset');
  };
  const pwSheet = mode => {
    save.now();
    if(!/^\S+@\S+\.\S+$/.test(p.email || '')){ toast(tx('Bitte zuerst eine gültige Login-E-Mail eintragen.','Please enter a valid login email first.')); f.email.focus(); return; }
    const pw0 = genPw();
    openSheet(`<h3>${mode === 'create' ? tx('Zugang erstellen','Create login') : tx('Neues Passwort','New password')}</h3>
      <p class="sub" style="font-size:14px;overflow-wrap:anywhere">${esc(p.name)} · ${esc(p.email)}</p>
      <form id="pwf" novalidate style="margin-top:16px"><label class="field"><input id="pwv" value="${pw0}" autocomplete="off" spellcheck="false" placeholder=" "><span>${tx('Passwort','Password')}</span></label><p class="err" id="pwe"></p>
      <button class="btn gold wide">${btnInner(mode === 'create' ? tx('Zugang erstellen','Create login') : tx('Passwort festlegen','Set password'))}</button></form>
      <div id="pwdone"></div>${CLOUD ? '' : `<p class="small">${tx('Demo-Modus: Es wird kein echter Zugang angelegt.','Demo mode: no real login is created.')}</p>`}`, (sh, close) => {
      $('#pwf', sh).onsubmit = e => { e.preventDefault(); const v = $('#pwv', sh).value.trim(), er = $('#pwe', sh);
        if(v.length < 8){ er.textContent = tx('Mindestens 8 Zeichen.','At least 8 characters.'); er.classList.add('show'); return; }
        busy($('#pwf .btn', sh), async () => {
          try{ const r = await adminCall(mode === 'create' ? 'create' : 'reset', {player_id:p.id, email:p.email, password:v, name:p.name});
            if(mode === 'create'){ p.user_id = r.user_id || ('demo-' + p.id); snap.players[p.id] = JSON.stringify(toDb(p)); if(!CLOUD) saveD(); }
            return true; }catch(x){ er.textContent = x.message; er.classList.add('show'); return false; } }, 0).then(ok => { if(!ok) return;
          $('#pwf', sh).style.display = 'none';
          $('#pwdone', sh).innerHTML = `<div class="pwbox"><small>${tx('Zugangsdaten für den Spieler','Login details for the player')}</small><b>${esc(p.email)}</b><code>${esc(v)}</code></div>
            <div class="lbtns"><button class="btn ghost" id="pwcopy">${tx('Kopieren','Copy')}</button><button class="btn gold" id="pwok">${tx('Fertig','Done')}</button></div>
            <p class="small">${tx('Schick dem Spieler diese Daten. Er kann das Passwort danach in den Einstellungen ändern.','Send these details to the player. They can change the password in settings afterwards.')}</p>`;
          $('#pwcopy', sh).onclick = async () => { try{ await navigator.clipboard.writeText(`${location.origin + location.pathname.replace(/index\.html$/, '')}\nE-Mail: ${p.email}\nPasswort: ${v}`); toast(tx('Kopiert','Copied')); }catch(x){ toast(tx('Kopieren nicht möglich, bitte markieren','Copy not available, please select the text')); } };
          $('#pwok', sh).onclick = close; drawAcc(); });
      };
    });
  };
  drawAcc();
  let mail0 = p.email;
  f.email.addEventListener('blur', async () => { save.now(); if(!CLOUD || !p.user_id || p.email === mail0 || !/^\S+@\S+\.\S+$/.test(p.email)) return;
    try{ await adminCall('email', {player_id:p.id, email:p.email}); mail0 = p.email; toast(tx('Login-E-Mail geändert','Login email changed')); drawAcc(); }catch(e){ toast(e.message); } });
  $('#pview', b).onclick = () => { save.now(); if(!p.name) p.name = tx('Neuer Spieler','New player'); saveD(); session = Object.assign({}, session, {pid:p.id}); if(!staffOnly()) LS.set('nxt_sess', session); tab = 'profile'; closeAdmin(); setTimeout(() => toast(t('viewing',{n:p.name})), 300); };
  $('#pdel', b).onclick = () => { const i = D.players.indexOf(p); D.players.splice(i,1); saveD(); deleteLater(p); go2(null, -1);
    toast(tx('Profil gelöscht','Profile deleted'), {label:t('undo'), fn:() => { D.players.splice(i,0,p); saveD(); if(!A.detail && A.tab === 'profiles') aRender(0, true); }}); };
}

/* --- Resources --- */
function aRes(b){
  if(!A.resP || !D.players.find(p => p.id === A.resP)) A.resP = D.players[0]?.id;
  b.innerHTML = `
    <h2 style="margin-top:6px">${t('forAll')}</h2>
    <div id="gl"></div>
    <h2>${t('forYou')}</h2>
    <p class="ahint" style="margin-top:-4px">${tx('Persönliche Links pro Spieler. Dieselben Links findest du auch im jeweiligen Profil.','Personal links per player. The same links show up in each profile.')}</p>
    ${D.players.length ? `<div class="pchips">${D.players.map(x => `<button data-p="${x.id}" aria-pressed="${x.id===A.resP}">${esc((x.name||'?').split(' ')[0])}</button>`).join('')}</div><div id="pl2"></div>` : `<p class="small">${tx('Noch keine Spieler','No players yet')}</p>`}`;
  linkEditor(D.global, $('#gl', b), saveD, true);
  const p = D.players.find(x => x.id === A.resP); if(p) linkEditor(p.links, $('#pl2', b), saveD, true);
  $$('.pchips button', b).forEach(x => x.onclick = () => { A.resP = x.dataset.p; $$('.pchips button', b).forEach(y => y.setAttribute('aria-pressed', y === x));
    const h = $('#pl2', b); h.className = ''; void h.offsetWidth; h.className = 'panel'; linkEditor(D.players.find(q => q.id === A.resP).links, h, saveD, true); });
}

/* --- Link editor: tap to edit inline, add, delete with undo --- */
function linkEditor(list, holder, onChange, withCat){
  let editing = null;
  const catSel = v => withCat ? `<label class="field sel"><select class="lc">${CATS.map(([k,l]) => `<option value="${k}" ${k===(v||'')?'selected':''}>${l()}</option>`).join('')}</select><span>${tx('Kategorie','Category')}</span></label>` : '';
  const form = (l, isNew) => `<form class="lform" novalidate>
      <label class="field"><input class="lt" placeholder=" " value="${esc(l.t||'')}" autocomplete="off"><span>${t('title')}</span></label>
      <label class="field"><input class="lu" placeholder=" " inputmode="url" value="${esc(l.u||'')}" autocomplete="off"><span>${t('url')}</span></label>
      ${catSel(l.c)}<p class="err"></p>
      <div class="lbtns"><button type="button" class="btn ghost lcancel">${tx('Abbrechen','Cancel')}</button><button class="btn gold">${btnInner(isNew ? t('add') : tx('Übernehmen','Apply'))}</button></div></form>`;
  const draw = () => {
    holder.innerHTML = `<div class="grp alist">${list.length ? list.map((l,i) => editing === i ? `<div class="lrow editing">${form(l,false)}</div>` :
        `<div class="lrow"><button class="tx" data-e="${i}" title="${tx('Bearbeiten','Edit')}"><b>${esc(l.t)}</b><small>${esc(host(l.u))}</small></button><button class="ib" data-e="${i}" aria-label="${tx('Bearbeiten','Edit')}">${AI.edit}</button><button class="ib del" data-d="${i}" aria-label="${tx('Löschen','Delete')}">${AI.trash}</button></div>`).join('')
      : (editing === 'new' ? '' : `<div class="lrow empty-row">${tx('Noch keine Links','No links yet')}</div>`)}
      ${editing === 'new' ? `<div class="lrow editing">${form({}, true)}</div>` : ''}</div>
      ${editing === 'new' ? '' : `<button class="btn ghost wide addbtn" data-add>${AI.plus}<span>${tx('Link hinzufügen','Add link')}</span></button>`}`;
    $$('[data-e]', holder).forEach(x => x.onclick = () => { editing = +x.dataset.e; draw(); $('.lt', holder)?.focus(); });
    $$('[data-d]', holder).forEach(x => x.onclick = () => {
      const i = +x.dataset.d, row = x.closest('.lrow'), item = list[i]; row.classList.add('out');
      setTimeout(() => { list.splice(i,1); onChange(); draw(); toast(t('removed'), {label:t('undo'), fn:() => { list.splice(i,0,item); onChange(); if(holder.isConnected) draw(); }}); }, 230);
    });
    const add = $('[data-add]', holder); if(add) add.onclick = () => { editing = 'new'; draw(); $('.lt', holder)?.focus(); };
    const f = $('.lform', holder);
    if(f){
      $('.lcancel', f).onclick = () => { editing = null; draw(); };
      f.addEventListener('keydown', e => { if(e.key === 'Escape'){ e.stopPropagation(); editing = null; draw(); } });
      f.onsubmit = e => { e.preventDefault();
        const tt = $('.lt', f).value.trim(); let u = $('.lu', f).value.trim(); const er = $('.err', f);
        if(u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
        let ok = !!tt; try{ new URL(u) }catch(x){ ok = false }
        if(!ok){ er.textContent = tx('Titel und gültiger Link, z. B. https://example.com','Title and a valid link, e.g. https://example.com'); er.classList.add('show');
          const fl = (!tt ? $('.lt', f) : $('.lu', f)).closest('.field'); fl.classList.remove('shake'); void fl.offsetWidth; fl.classList.add('shake'); return; }
        const c = $('.lc', f)?.value ?? '';
        if(editing === 'new') list.push({t:tt, u, c}); else Object.assign(list[editing], {t:tt, u, c});
        const wasNew = editing === 'new'; editing = null; onChange(); draw(); toast(wasNew ? t('added') : t('saved'));
      };
    }
  };
  draw();
}

/* ============ Boot ============ */
if(CLOUD){
  sb.auth.onAuthStateChange(ev => { if(ev === 'PASSWORD_RECOVERY') setTimeout(setNewPassword, 600); });
  splash(async () => {
    let ok = false; try{ ok = await cloudLoad(); }catch(e){ console.error(e); }
    go(ok ? 'app' : 'login');
    if(ok && isAdmin && !session.own) setTimeout(openAdmin, 500);
  });
} else splash(() => go(session ? 'app' : 'login'));
function setNewPassword(){
  openSheet(`<h3>${tx('Neues Passwort','New password')}</h3><p class="sub" style="font-size:14px">${tx('Wähle ein neues Passwort mit mindestens 8 Zeichen.','Choose a new password with at least 8 characters.')}</p>
    <form id="npf" novalidate style="margin-top:16px"><label class="field"><input type="password" id="np" autocomplete="new-password" placeholder=" "><span>${t('newPw')}</span></label><p class="err" id="npe"></p>
    <button class="btn gold wide">${btnInner(t('save'))}</button></form>`, (sh, close) => {
    $('#npf', sh).onsubmit = e => { e.preventDefault(); const v = $('#np', sh).value, er = $('#npe', sh);
      if(v.length < 8){ er.textContent = tx('Mindestens 8 Zeichen.','At least 8 characters.'); er.classList.add('show'); return; }
      busy($('.btn', sh), async () => { const {error} = await sb.auth.updateUser({password:v}); if(error){ er.textContent = error.message; er.classList.add('show'); return false; } return true; }, 0)
        .then(async ok => { if(!ok) return; close(); toast(t('pwSaved')); try{ history.replaceState(null, '', location.pathname); }catch(e){} if(await cloudLoad().catch(() => false)) go('app'); }); };
  });
}
if('serviceWorker' in navigator && location.protocol === 'https:' && CLOUD){ try{ navigator.serviceWorker.register('sw.js').catch(() => {}); }catch(e){} }
}
</script>
