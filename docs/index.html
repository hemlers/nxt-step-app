<!DOCTYPE html>
<html lang="de" data-look="glass" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="preload" as="image" href="img/liberty.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NXT Step">
<script src="config.js"></script>
<script>if(window.NXT_CONFIG && NXT_CONFIG.supabaseUrl) document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>');</script>
<title>NXT Step USA App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: Matchday-Programm statt Tech-Dashboard. Ruhig, sportlich, direkt
   IDEA: der Platz bei Flutlicht von oben. Mähstreifen und Kreidelinien liegen unter allem
   PICTURE: der Elixier-Zylinder im Pathway, das Video randlos im Profil
   COLOUR and TYPE: Schwarz #080808 / Off-White #F4F3EF, Gold #E8BB3D nur für Elixier, Hauptbutton und „Jetzt dran“; Montserrat
   LAYOUT: Inhalt liegt direkt auf dem Platz, Glas nur auf Navigation, Header und Sheets */

/* ---------- Motion tokens ---------- */
:root{
  --out:cubic-bezier(.32,.72,0,1); --in:cubic-bezier(.55,0,1,.45); --io:cubic-bezier(.77,0,.175,1); --pop:cubic-bezier(.34,1.32,.64,1);
  --t-press:140ms; --t-pop:220ms; --t-sheet:300ms; --stagger:55ms;
}
/* ---------- Theme ---------- */
:root{
  --gold:#E8BB3D; --gold-d:#C99A22; --onGold:#0B0B0B;
  --bg:#080808; --ink:#F4F3EF; --mute:rgba(244,243,239,.56); --faint:rgba(244,243,239,.32);
  --line:rgba(244,243,239,.09); --line2:rgba(244,243,239,.16);
  --panel:#121212; --panel2:#1A1A1A; --fill:rgba(244,243,239,.06);
  --stripeA:#0A0B0A; --stripeB:#0D0E0D; --chalk:rgba(244,243,239,.07);
  --goldInk:#E8BB3D; --danger:#FF6B5E; --ok:#5BC08A;
  --glassBg:rgba(22,22,22,.48); --glassEdge:rgba(255,255,255,.14); --glassHi:rgba(255,255,255,.22);
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#F4F3EF; --ink:#0B0B0B; --mute:rgba(11,11,11,.58); --faint:rgba(11,11,11,.36);
  --line:rgba(11,11,11,.08); --line2:rgba(11,11,11,.15);
  --panel:#FFFFFF; --panel2:#ECEBE6; --fill:rgba(11,11,11,.05);
  --stripeA:#F4F3EF; --stripeB:#EEEDE7; --chalk:rgba(11,11,11,.07);
  --goldInk:#8F6700; --danger:#C8372B;
  --glassBg:rgba(255,255,255,.52); --glassEdge:rgba(255,255,255,.7); --glassHi:rgba(255,255,255,.95);
  color-scheme:light;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:500 16px/1.5 Montserrat,system-ui,-apple-system,sans-serif;overflow-x:clip;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Background photos: behind glass in "Glasig", banners in "Neutral" ---------- */
.photo-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.photo-bg i{position:absolute;inset:-6% 0 0;background:center/cover no-repeat;opacity:0;transform:translateY(var(--py,0px)) scale(1.06);transition:opacity 600ms ease;will-change:transform,opacity}
.photo-bg i.on{opacity:1}
.photo-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,8,.30) 0%,rgba(8,8,8,.55) 22%,rgba(8,8,8,.86) 46%,#080808 78%)}
:root[data-theme=light] .photo-bg::after{background:linear-gradient(180deg,rgba(244,243,239,.18) 0%,rgba(244,243,239,.5) 22%,rgba(244,243,239,.88) 46%,#F4F3EF 78%)}
.photo-bg.full::after{background:linear-gradient(180deg,rgba(8,8,8,.05) 0%,rgba(8,8,8,.12) 35%,rgba(8,8,8,.8) 60%,#080808 90%)}
:root[data-theme=light] .photo-bg.full::after{background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.04) 35%,rgba(244,243,239,.86) 60%,#F4F3EF 90%)}
:root[data-look=neutral] .photo-bg{display:none}
.banner{display:none}
:root[data-look=neutral] .banner{display:block;height:180px;margin:0 -20px 18px;background:center/cover no-repeat}

/* ---------- Glass material: navigation & controls only ---------- */
.glass{position:relative;background:var(--glassBg);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glassEdge);box-shadow:inset 0 1px 0 var(--glassHi),inset 0 -1px 1px rgba(0,0,0,.12),0 12px 34px rgba(0,0,0,.28)}
:root[data-theme=light] .glass{box-shadow:inset 0 1px 0 var(--glassHi),0 10px 30px rgba(40,30,0,.12)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 60% at 30% -10%,rgba(255,255,255,.18),transparent 55%)}
:root[data-look=neutral] .glass{background:var(--panel);-webkit-backdrop-filter:none;backdrop-filter:none;border-color:var(--line);box-shadow:none}
:root[data-look=neutral] .glass::after{display:none}

/* grouped lists (content surfaces): solid, quiet */
.grp{background:var(--panel);border-radius:16px;overflow:hidden}
:root[data-look=glass] .grp{background:color-mix(in srgb,var(--panel) 88%,transparent)}

/* ---------- Shell ---------- */
#root{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100dvh}
.view{min-height:100dvh}
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  transition:background-color var(--t-pop) ease,box-shadow var(--t-pop) ease}
.hdr.scrolled{background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);box-shadow:0 1px 0 var(--line)}
:root[data-look=neutral] .hdr{background:var(--bg);box-shadow:0 1px 0 var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.01em;font-size:14px}
.brand svg{width:20px;height:25px;color:var(--ink)}
.gear{margin-left:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:transform var(--t-press) var(--out)}
.gear:active{transform:scale(.94)}
:root[data-look=neutral] .gear{background:none;border:0;box-shadow:none}
.gear svg{width:21px;height:21px;transition:transform 420ms var(--out)}
.gear.on svg{transform:rotate(90deg)}
main{padding:2px 20px calc(env(safe-area-inset-bottom) + 118px)}

/* entrance: one after another */
.st{animation:rise 440ms var(--out) both;animation-delay:calc(var(--i,0) * var(--stagger))}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.leave{animation:leave 170ms var(--in) both}
@keyframes leave{to{opacity:0;transform:translateX(var(--lx,0))}}
.enter-l{--ex:-20px}.enter-r{--ex:20px}
.enter-l .st,.enter-r .st{animation-name:riseX}
@keyframes riseX{from{opacity:0;transform:translateX(var(--ex))}to{opacity:1;transform:none}}

/* ---------- Type ---------- */
h1{font-size:32px;line-height:1.05;font-weight:800;margin:4px 0 6px;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:15px;font-weight:700;margin:28px 2px 10px;color:var(--ink)}
.sub{color:var(--mute);font-size:15px;margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- Buttons & inputs ---------- */
.btn{position:relative;display:inline-grid;place-items:center;min-height:52px;padding:0 22px;border-radius:14px;font-weight:700;font-size:16px;
  transition:transform var(--t-press) var(--out),background-color var(--t-press) ease,opacity var(--t-press) ease}
.btn:active{transform:scale(.97)}
.btn > *{grid-area:1/1}
.btn.gold{background:var(--gold);color:var(--onGold)}
.btn.gold:disabled{opacity:1}
.btn.ghost{background:var(--fill);color:var(--ink)}
.btn.wide{width:100%}
.btn .lbl,.btn .spin,.btn .ok{transition:opacity 200ms var(--out),transform 260ms var(--out),filter 200ms ease}
.btn .spin,.btn .ok{opacity:0;transform:scale(.3);filter:blur(3px)}
.btn[data-s=busy] .lbl,.btn[data-s=ok] .lbl{opacity:0;transform:scale(.6);filter:blur(3px)}
.btn[data-s=busy] .spin{opacity:1;transform:none;filter:none}
.btn[data-s=ok] .ok{opacity:1;transform:none;filter:none}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.ok svg{width:22px;height:22px}
.ok path{stroke-dasharray:1;stroke-dashoffset:1}
.btn[data-s=ok] .ok path{stroke-dashoffset:0;transition:stroke-dashoffset 320ms var(--out) 60ms}

.field{position:relative;display:block;margin-bottom:10px}
.field input{width:100%;height:56px;padding:21px 15px 6px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);font-size:16px;font-weight:500;outline:none;
  transition:border-color var(--t-press) ease}
.field input:focus{border-color:var(--ink)}
.field span{position:absolute;left:16px;top:17px;color:var(--mute);pointer-events:none;transform-origin:left top;transition:transform 200ms var(--out)}
.field input:focus + span,.field input:not(:placeholder-shown) + span{transform:translateY(-10px) scale(.74)}
.field .eye{position:absolute;right:6px;top:6px;width:44px;height:44px;display:grid;place-items:center;color:var(--mute)}
.eye svg{grid-area:1/1;width:20px;height:20px;transition:opacity 180ms var(--out),transform 240ms var(--out),filter 180ms ease}
.eye .b{opacity:0;transform:scale(.3);filter:blur(3px)}
.eye.on .a{opacity:0;transform:scale(.3);filter:blur(3px)}
.eye.on .b{opacity:1;transform:none;filter:none}
.err{color:var(--danger);font-size:13px;min-height:0;max-height:0;margin:0 4px;opacity:0;overflow:hidden;transition:opacity 200ms var(--out),max-height 200ms var(--out),margin 200ms var(--out)}
.err.show{opacity:1;max-height:60px;margin:-2px 4px 10px}
.shake{animation:shake 360ms linear}
@keyframes shake{0%{transform:translateX(0)}16%{transform:translateX(-10px)}33%{transform:translateX(10px)}50%{transform:translateX(-6px)}66%{transform:translateX(6px)}83%{transform:translateX(-3px)}100%{transform:translateX(0)}}

.sw{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:51px;height:31px;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:background-color 200ms ease}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:99px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform 280ms var(--pop),width 160ms var(--out)}
.sw:active i::after{width:33px}
.sw input:checked + i{background:var(--ink)}
:root[data-theme=dark] .sw input:checked + i{background:var(--gold)}
.sw input:checked + i::after{transform:translateX(20px)}
.sw:active input:checked + i::after{transform:translateX(14px)}
.sw input:focus-visible + i{outline:2px solid var(--gold);outline-offset:3px}

.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:11px;background:var(--fill)}
.seg button{position:relative;z-index:1;min-height:36px;border-radius:9px;font-size:min(14px,3.5vw);font-weight:600;color:var(--mute);transition:color 200ms ease}
.seg button[aria-pressed=true]{color:var(--ink)}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.18);transition:transform 320ms var(--pop)}
:root[data-theme=dark] .seg .thumb{background:#3A3A3C}

/* ---------- Splash ---------- */
.splash{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:var(--bg)}
.splash svg{width:110px;height:138px;color:var(--ink)}
.splash path{fill:currentColor;fill-opacity:0;stroke:var(--ink);stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;
  animation:draw 900ms var(--io) forwards,fillin 400ms var(--out) 750ms forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1;stroke-width:0}}
.splash.out{animation:splashOut 360ms var(--in) forwards}
@keyframes splashOut{to{opacity:0;transform:scale(1.04)}}
.wm{display:flex;justify-content:center;font-weight:800;font-size:21px;letter-spacing:.02em}
.wm span{display:inline-block;animation:letter 420ms var(--out) both;animation-delay:calc(var(--i)*35ms + 300ms)}
@keyframes letter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Login ---------- */
.login{display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 64px) 24px 32px;min-height:100dvh}
.login .mark{width:56px;height:70px;color:var(--ink);margin-bottom:28px}
.login h1{font-size:36px;max-width:11ch}
.login .tag{color:var(--mute);margin:0 0 32px;font-size:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.link{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2);font-weight:600;font-size:14px;min-height:44px;display:inline-flex;align-items:center}
.demo{font-size:13px;color:var(--faint);margin-top:auto;padding-top:24px}

/* ---------- Install guide ---------- */
.inst{padding:calc(env(safe-area-inset-top) + 24px) 22px 28px;min-height:100dvh;display:flex;flex-direction:column}
.inst h1{font-size:28px}
.phone{position:relative;width:212px;height:392px;margin:22px auto 16px;border-radius:40px;padding:8px;background:#111;box-shadow:0 0 0 1px #2a2a2a,0 24px 50px rgba(0,0,0,.35)}
.scr{position:relative;width:100%;height:100%;border-radius:32px;overflow:hidden;background:#0c0c0c}
.scr .site{position:absolute;inset:34px 14px 70px;border-radius:10px;background:#151515;padding:14px;display:flex;flex-direction:column;gap:8px}
.scr .site i{display:block;height:7px;border-radius:4px;background:rgba(255,255,255,.12)}
.scr .site i.g{background:#F4F3EF;width:40%;height:10px}
.bar{position:absolute;left:10px;right:10px;height:40px;border-radius:14px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-around;color:#ddd}
.bar.ios{bottom:12px}.bar.and{top:8px;justify-content:flex-end;padding-right:6px}
.bar svg{width:16px;height:16px}
.bar .url{position:absolute;left:12px;right:40px;height:22px;border-radius:7px;background:rgba(255,255,255,.12);font-size:9px;display:flex;align-items:center;padding-left:8px;color:#bbb}
.bar.ios .url{display:none}
.hot{position:absolute;width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);opacity:0;transform:scale(.6);transition:opacity 220ms var(--out),transform 300ms var(--out)}
.hot.on{opacity:1;transform:none;animation:ping 1.6s var(--out) infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(232,187,61,.55)}70%{box-shadow:0 0 0 14px rgba(232,187,61,0)}100%{box-shadow:0 0 0 0 rgba(232,187,61,0)}}
.hand{position:absolute;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));transition:opacity 200ms ease;animation:tap 1.6s var(--io) infinite;opacity:0}
@keyframes tap{0%,100%{transform:translate(8px,10px) scale(1)}40%{transform:translate(0,0) scale(1)}50%{transform:translate(0,0) scale(.88)}60%{transform:translate(0,0) scale(1)}}
.msheet{position:absolute;left:8px;right:8px;bottom:8px;border-radius:16px;background:rgba(44,44,46,.97);padding:8px;transform:translateY(110%);transition:transform 360ms var(--out)}
.msheet.on{transform:none}
.msheet.and{top:52px;bottom:auto;left:auto;right:8px;width:150px;transform-origin:top right;transform:scale(.9);opacity:0;transition:transform 250ms var(--out),opacity 200ms var(--out)}
.msheet.and.on{transform:none;opacity:1}
.mi{display:flex;align-items:center;justify-content:space-between;height:30px;padding:0 8px;border-radius:8px;font-size:10px;color:#ddd}
.mi.t{background:rgba(255,255,255,.14);color:#fff;font-weight:700}
.dlg{position:absolute;inset:0;background:#161616;padding:12px;transform:translateY(100%);transition:transform 360ms var(--out);font-size:10px;color:#ddd}
.dlg.on{transform:none}
.dlg .top{display:flex;justify-content:space-between;align-items:center;height:30px;font-weight:700}
.dlg .add{color:#0A84FF}
.dlg .ic{display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px;border-radius:10px;background:rgba(255,255,255,.06)}
.appic{width:38px;height:38px;border-radius:10px;background:#000;display:grid;place-items:center;border:1px solid rgba(255,255,255,.15)}
.appic svg{width:16px;height:20px;color:#fff}
.home{position:absolute;inset:0;padding:40px 18px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px;align-content:start;opacity:0;transition:opacity 300ms ease;background:#1c1c1e}
.home.on{opacity:1}
.home i{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);justify-self:center}
.home .appic{justify-self:center;transform:scale(0);transition:transform 520ms var(--pop) 250ms}
.home.on .appic{transform:scale(1)}
.platform{margin:18px 0 0;width:min(240px,100%)}
.steps{display:flex;gap:6px;justify-content:center;margin:4px 0 14px}
.steps i{height:6px;width:6px;border-radius:3px;background:var(--line2);transition:width 300ms var(--out),background-color 200ms ease}
.steps i.on{width:22px;background:var(--ink)}
.stxt{text-align:center;min-height:56px;display:grid}
.stxt p{grid-area:1/1;margin:0;font-weight:700;font-size:18px;transition:opacity 240ms var(--out),transform 280ms var(--out),filter 240ms ease}
.stxt p.off{opacity:0;transform:translateX(var(--d,16px));filter:blur(3px);pointer-events:none}
.inst .acts{margin-top:auto;display:grid;grid-template-columns:1fr 1.4fr;gap:10px}

/* ---------- Tab bar: floating glass capsule / docked bar in neutral ---------- */
.tabs{position:fixed;z-index:30;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);
  width:min(400px,calc(100% - 40px));display:grid;grid-template-columns:repeat(3,1fr);padding:5px;border-radius:999px}
.tabs button{position:relative;z-index:1;height:54px;border-radius:999px;display:grid;justify-items:center;align-content:center;gap:1px;font-size:11px;font-weight:600;color:var(--mute);transition:color 220ms ease}
.tabs button[aria-selected=true]{color:var(--ink)}
.tabs svg{width:23px;height:23px}
.tabs button[aria-selected=true] svg{animation:hop 420ms var(--pop)}
@keyframes hop{0%{transform:scale(1)}35%{transform:scale(.84) translateY(2px)}70%{transform:scale(1.1) translateY(-1px)}100%{transform:none}}
.tabs .pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:999px;background:var(--fill);transition:transform 380ms var(--pop)}
:root[data-theme=dark] .tabs .pill{background:rgba(255,255,255,.12)}
:root[data-look=neutral] .tabs{left:0;right:0;bottom:0;transform:none;width:100%;border-radius:0;border-width:1px 0 0;padding:4px max(8px,calc(50% - 240px)) calc(env(safe-area-inset-bottom) + 4px)}
:root[data-look=neutral] .tabs .pill{display:none}
:root[data-look=neutral] .tabs button{border-radius:0}
:root[data-look=neutral] .tabs button[aria-selected=true]{color:var(--ink)}
:root[data-look=neutral] .tabs button[aria-selected=true]::before{content:"";position:absolute;top:-5px;left:30%;right:30%;height:2px;background:var(--ink);border-radius:2px}

/* ---------- Pathway ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:6px}
.pct{font-size:56px;font-weight:800;line-height:.9;letter-spacing:-.04em}
.pct small{font-size:22px;letter-spacing:0;color:var(--mute)}
.path{position:relative;display:grid;margin-top:22px;padding-left:52px}
.vessel{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:1}
.vessel .sh-o *{fill:none;stroke:var(--line2);stroke-width:3}
.vessel .sh-f *{fill:var(--bg)}
:root[data-look=glass] .vessel .sh-f *{fill:rgba(20,20,20,.6)}
:root[data-look=glass][data-theme=light] .vessel .sh-f *{fill:rgba(255,255,255,.65)}
:root[data-theme=light] .vessel .sh-o *{stroke:rgba(11,11,11,.18)}
.vessel .w1{animation:wv 1.7s linear infinite}
.vessel .w2{animation:wv 2.6s linear infinite reverse}
.vessel .w2 path{transform:translateY(1.2px)}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(22px)}}
.vessel .bubs circle{fill:rgba(255,244,210,.85);opacity:0}
.vessel.live .bubs circle{animation:bub 3s linear infinite}
@keyframes bub{0%{transform:translateY(var(--fh,0px));opacity:0}12%{opacity:.85}92%{opacity:.6}100%{transform:translateY(4px);opacity:0}}
.vessel .lb text{font:700 11px Montserrat,system-ui,sans-serif;fill:var(--mute);text-anchor:middle;transition:opacity 200ms ease}
.vessel .lb.cur text{fill:var(--ink)}
.vessel .lb path{fill:none;stroke:#2A1C00;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.vessel .lb.on text{opacity:0}
.vessel .lb.on path{stroke-dashoffset:0;transition:stroke-dashoffset 380ms var(--out) 120ms}
.vessel .ring{fill:none;stroke:var(--gold);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 700ms var(--out) forwards}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.8);opacity:0}}
.vessel .pulse{fill:none;stroke:var(--gold);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}
.vessel.live .pulse{animation:pulse 2.4s var(--out) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(1.45);opacity:0}}
.task{position:relative;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .hd{width:100%;display:flex;align-items:center;gap:10px;min-height:66px;padding:10px 2px;text-align:left}
.task .tt{flex:1}
.task .tt b{display:block;font-size:16px;line-height:1.25;font-weight:700}
.task .tt small{color:var(--mute);font-size:13px;font-weight:500}
.chip{font-size:12px;font-weight:700;white-space:nowrap;color:var(--mute)}
.chip.cur{background:var(--gold);color:var(--onGold);padding:4px 9px;border-radius:7px}
.chip.done{color:var(--mute);font-weight:600}
.chip.pend{color:var(--ink);padding:3px 8px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--line2)}
.chev{width:18px;height:18px;color:var(--faint);transition:transform 280ms var(--out);flex:none}
.task.open .chev{transform:rotate(180deg)}
.task.done .tt b{color:var(--mute);font-weight:600}
.task.lock .tt b{color:var(--mute)}
.task.cur{border-bottom-color:transparent}
.task.cur::before{content:"";position:absolute;inset:4px -12px 6px -12px;border-radius:16px;background:var(--panel);z-index:-1}
:root[data-look=glass] .task.cur::before{background:color-mix(in srgb,var(--panel) 92%,transparent);box-shadow:0 0 0 1px var(--line)}
.task.cur .hd{padding-top:14px}
.bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows 300ms var(--io)}
.task.open .bd{grid-template-rows:1fr}
.bd > div{overflow:hidden}
.bd .in{padding:0 2px 18px;opacity:0;transform:translateY(-6px);transition:opacity 200ms ease,transform 260ms var(--out)}
.task.open .bd .in{opacity:1;transform:none;transition-delay:80ms}
.bd p{margin:0 0 12px;font-size:15px;line-height:1.55}
.bd h4{margin:16px 0 6px;font-size:13px;font-weight:700;color:var(--ink)}
.bd ol{margin:0;padding-left:20px;font-size:15px}
.bd li{margin:5px 0;padding-left:2px}
.bd li::marker{color:var(--mute);font-weight:700}
.lk{display:flex;flex-direction:column}
.lk a{display:flex;align-items:center;justify-content:space-between;min-height:44px;font-size:15px;font-weight:600;text-decoration:none;border-bottom:1px solid var(--line)}
.lk a:last-child{border-bottom:0}
.lk a svg{width:15px;height:15px;color:var(--mute);transition:transform 200ms var(--out)}
@media(hover:hover) and (pointer:fine){.lk a:hover svg{transform:translate(2px,-2px);color:var(--ink)}}
.info{margin-top:14px;padding-left:12px;border-left:2px solid var(--gold);font-size:14px;color:var(--mute)}
.info b{color:var(--ink)}
.bd .btn{margin-top:16px;min-height:50px}

/* ---------- Profile ---------- */
.vid{position:relative;aspect-ratio:16/10;margin:0 -20px;overflow:hidden;background:#050505}
.vid svg.pitch{position:absolute;inset:0;width:100%;height:100%;background:repeating-linear-gradient(90deg,#0b0c0b 0 40px,#0e0f0e 40px 80px)}
.vid svg.pitch path,.vid svg.pitch circle,.vid svg.pitch rect{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s var(--io) .2s forwards}
.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.vid .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.72))}
.play{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);color:#fff;transition:transform var(--t-press) var(--out)}
.play:active{transform:scale(.94)}
.play::before{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);animation:ripple 2.4s var(--out) infinite}
@keyframes ripple{from{transform:scale(1);opacity:.8}to{transform:scale(1.6);opacity:0}}
.play svg{width:26px;height:26px;transform:translateX(2px)}
.vcap{position:absolute;left:20px;bottom:14px;right:20px;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;font-weight:600}
.vcap span:first-child{font-size:12px;opacity:.75}
.pname{margin-top:20px}
.pname h1{margin:0;font-size:34px}
.pname .sub{margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px;margin-top:20px;border-top:1px solid var(--line)}
.fact{padding:12px 0;border-bottom:1px solid var(--line)}
.fact small{display:block;color:var(--mute);font-size:12px;font-weight:600}
.fact b{display:block;font-size:16px;font-weight:700;margin-top:1px}
.fact.wide{grid-column:1/-1}
.sync{color:var(--faint);font-size:13px;margin-top:16px}
.small{font-size:13px;color:var(--faint);margin:8px 0 0}

/* ---------- Resources ---------- */
.search{position:relative;margin-top:16px}
.search input{width:100%;height:46px;border-radius:12px;border:0;background:var(--fill);padding:0 44px 0 42px;font-size:16px;outline:none}
:root[data-look=glass] .search input{background:color-mix(in srgb,var(--panel) 85%,transparent)}
.search input:focus{box-shadow:inset 0 0 0 1px var(--line2)}
.search svg{position:absolute;left:13px;top:13px;width:19px;height:19px;color:var(--mute)}
.search .x{position:absolute;right:1px;top:1px;width:44px;height:44px;display:grid;place-items:center;color:var(--mute);opacity:0;transform:scale(.6);transition:opacity 160ms ease,transform 200ms var(--out);pointer-events:none}
.search .x svg{position:static}
.search.has .x{opacity:1;transform:none;pointer-events:auto}
.cats{position:relative;display:flex;gap:18px;overflow-x:auto;padding:14px 2px 0;scrollbar-width:none;border-bottom:1px solid var(--line)}
.cats button{flex:none;min-height:40px;font-size:14px;font-weight:600;color:var(--mute);transition:color 160ms ease}
.cats button[aria-pressed=true]{color:var(--ink)}
.cats .ul{position:absolute;bottom:-1px;left:0;height:2px;background:var(--ink);border-radius:2px;transition:transform 320ms var(--out),width 320ms var(--out)}
.list{display:grid}
.res{display:flex;align-items:center;gap:14px;min-height:62px;padding:10px 16px;text-decoration:none;border-bottom:1px solid var(--line);transition:background-color var(--t-press) ease}
.res:last-child{border-bottom:0}
.res:active{background:var(--fill)}
.res .ico{width:20px;height:20px;flex:none;color:var(--mute)}
.res .ico svg{width:20px;height:20px}
.res.mine .ico{color:var(--goldInk)}
.res .tx{flex:1}
.res .tx b{display:block;font-size:15px;line-height:1.3;font-weight:600}
.res .tx small{color:var(--mute);font-size:12px}
.res .ar{width:16px;height:16px;color:var(--faint);transition:transform 200ms var(--out),color 200ms ease}
@media(hover:hover) and (pointer:fine){.res:hover{background:var(--fill)}.res:hover .ar{transform:translate(3px,-3px);color:var(--ink)}}
.res.hide{display:none}
.empty{text-align:center;color:var(--mute);padding:30px 10px;display:none}
.empty.show{display:block;animation:rise 300ms var(--out)}

/* ---------- Sheets ---------- */
.scrim{position:fixed;inset:0;z-index:75;background:rgba(0,0,0,.4);opacity:0;transition:opacity var(--t-sheet) var(--out)}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:76;left:50%;bottom:8px;width:min(464px,calc(100% - 16px));max-height:90dvh;overflow:auto;overscroll-behavior:contain;
  padding:6px 18px calc(env(safe-area-inset-bottom) + 22px);border-radius:34px;transform:translate(-50%,110%);transition:transform var(--t-sheet) var(--out)}
.sheet.on{transform:translate(-50%,0)}
.sheet.closing{transition:transform 220ms var(--in)}
.sheet.drag{transition:none}
:root[data-look=neutral] .sheet{bottom:0;width:min(480px,100%);border-radius:16px 16px 0 0;background:var(--bg)}
:root[data-look=glass] .sheet .grp{background:color-mix(in srgb,var(--panel) 55%,transparent)}
.grab{display:block;margin:0 auto 4px;width:100%;height:22px;cursor:grab;touch-action:none;position:relative}
.grab::after{content:"";position:absolute;left:50%;top:8px;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--line2)}
.sheet.settled .grab::after{animation:grabin 500ms var(--pop) 80ms}
@keyframes grabin{0%{transform:scaleX(.5)}100%{transform:none}}
.sheet h3{font-size:24px;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}
.grp-wrap{margin-top:20px}
.lab{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:0 4px 8px}
.opts{display:grid;padding:4px 14px}
.opt{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:10px;font-size:15px;font-weight:600;min-height:54px;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px;text-align:left;font-weight:600;font-size:15px;border-bottom:1px solid var(--line);transition:background-color var(--t-press) ease}
.mrow:last-child{border-bottom:0}
.mrow:active{background:var(--fill)}
@media(hover:hover) and (pointer:fine){.mrow:hover{background:var(--fill)}}
.mrow svg{width:19px;height:19px;color:var(--mute)}
.mrow .chev{margin-left:auto}
.mrow.open .chev{transform:rotate(180deg)}
.mrow.red{color:var(--danger)}.mrow.red svg{color:var(--danger)}
.xp{display:grid;grid-template-rows:0fr;transition:grid-template-rows 300ms var(--io);border-bottom:1px solid var(--line)}
.xp.open{grid-template-rows:1fr}
.xp > div{overflow:hidden}
.xp .in{padding:4px 16px 16px}

/* ---------- Admin ---------- */
.admin{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;transform:translateY(100%);transition:transform 360ms var(--out)}
.admin.on{transform:none}
.admin.closing{transition:transform 260ms var(--in)}
.admin .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px 60px}
.admin .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.admin .top h3{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em}
.badge{font-size:12px;font-weight:600;color:var(--mute)}
.close{margin-left:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--fill);transition:transform var(--t-press) var(--out)}
.close:active{transform:scale(.92)}
.close svg{width:17px;height:17px}
.plist{display:grid}
.pl{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%;border-bottom:1px solid var(--line);transition:background-color var(--t-press) ease}
.pl:last-child{border-bottom:0}
.pl[aria-pressed=true]{background:var(--fill)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--ink);font-weight:700;font-size:14px;flex:none}
.pl[aria-pressed=true] .avatar{background:var(--ink);color:var(--bg)}
.pl .tx{flex:1}.pl small{color:var(--mute);font-size:12px}
.mini{height:4px;border-radius:2px;background:var(--line2);overflow:hidden;margin-top:6px}
.mini i{display:block;height:100%;background:var(--gold);transform-origin:left;transition:transform 300ms var(--io)}
.srow{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.srow:last-child{border-bottom:0}
.srow .sw{margin-left:auto}
.srow .k{width:22px;color:var(--mute);font-weight:600;font-size:13px}
.pend-note{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--panel);box-shadow:inset 3px 0 0 var(--gold);margin-bottom:10px;font-size:14px}
.pend-note .btn{min-height:40px;padding:0 14px;margin-left:auto;font-size:14px;border-radius:10px}
.addf{display:grid;gap:0;margin-top:12px}
.lrow{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 6px 0 14px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.lrow:last-child{border-bottom:0}
.lrow .tx{flex:1;overflow:hidden}
.lrow .tx small{display:block;color:var(--mute);font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{width:44px;height:44px;display:grid;place-items:center;color:var(--mute);border-radius:12px;transition:color 150ms ease,transform var(--t-press) var(--out)}
.del:active{transform:scale(.9)}
@media(hover:hover) and (pointer:fine){.del:hover{color:var(--danger)}}
.del svg{width:17px;height:17px}
.lrow.out{animation:rowOut 240ms var(--in) forwards}
@keyframes rowOut{to{opacity:0;transform:translateX(30px)}}
.map{display:grid}
.maprow{display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;gap:8px;font-size:14px;padding:11px 14px;border-bottom:1px solid var(--line)}
.maprow:last-child{border-bottom:0}
.maprow code{font-family:inherit;font-weight:700}
.maprow svg{width:15px;height:15px;color:var(--mute)}
.skel{height:44px;border-radius:10px;background:linear-gradient(90deg,var(--fill) 0%,var(--line2) 50%,var(--fill) 100%);background-size:200% 100%;animation:shim 1.1s linear infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.panel{animation:rise 320ms var(--out)}

/* ---------- Toast ---------- */
.toast{position:fixed;z-index:90;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);width:min(400px,calc(100% - 40px));
  display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:16px;font-size:14px;font-weight:600;
  transform:translate(-50%,16px) scale(.97);opacity:0;transition:transform 300ms var(--out),opacity 220ms var(--out);pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast .ti{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none;transform:scale(.4);transition:transform 360ms var(--pop) 40ms}
.toast.on .ti{transform:none}
.toast .ti svg{width:14px;height:14px}
.toast button{margin-left:auto;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:700;min-height:40px;padding:0 8px}
.toast .bar2{position:absolute;left:14px;right:14px;bottom:4px;height:2px;border-radius:1px;background:var(--ink);transform-origin:left;opacity:.35}

canvas.fx{position:fixed;inset:0;z-index:95;pointer-events:none;width:100%;height:100%}

::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:reveal 520ms var(--io)}
@keyframes reveal{from{clip-path:circle(0 at var(--vx,90%) var(--vy,8%))}to{clip-path:circle(150vmax at var(--vx,90%) var(--vy,8%))}}


/* ---------- photo-era additions ---------- */
:root[data-look=glass] .login{justify-content:flex-end;padding-top:min(36vh,300px)}
.login .demo{margin-top:20px;padding-top:0}
:root[data-look=neutral] .login{padding-top:0}
:root[data-look=neutral] .login .banner{height:36vh;margin:0 -24px 24px}
:root[data-look=glass] .login .tag,:root[data-look=glass] .login .demo{color:rgba(244,243,239,.72)}
:root[data-look=glass][data-theme=light] .login .tag{color:var(--mute)}
:root[data-look=glass] .login .field input{background:color-mix(in srgb,var(--panel) 70%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.vid .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 38%;animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1) translate(-1.5%,-1%)}}
:root[data-look=neutral] .banner{-webkit-mask:linear-gradient(#000 70%,transparent);mask:linear-gradient(#000 70%,transparent)}

/* ---------- Admin v2 ---------- */
.admin .top{align-items:flex-end}
.admin .top .badge{display:block;margin-bottom:2px}
#abody{margin-top:6px}
#abody.panel{animation:aIn 300ms var(--out)}
@keyframes aIn{from{opacity:0;transform:translateX(var(--ax,0))}to{opacity:1;transform:none}}
.ahint{font-size:13px;color:var(--mute);margin:14px 2px 10px}
.alist{display:grid}
.arow{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 8px 8px 14px;text-align:left;border-bottom:1px solid var(--line);background:var(--panel);position:relative}
.arow:last-child{border-bottom:0}
button.arow{transition:background-color var(--t-press) ease}
button.arow:active{background:var(--panel2)}
@media(hover:hover) and (pointer:fine){button.arow:hover,.amain:hover{background:var(--fill)}}
.anum{width:22px;font-size:13px;font-weight:700;color:var(--mute);flex:none;text-align:right}
.amain{flex:1;display:block;text-align:left;min-height:44px;padding:4px 6px;border-radius:8px}
.amain b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.amain small{display:block;font-size:12px;color:var(--mute);font-weight:500}
.amove{display:flex;gap:2px;flex:none}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--mute);transition:background-color var(--t-press) ease,transform var(--t-press) var(--out)}
.ib:active{transform:scale(.92);background:var(--fill)}
.ib:disabled{opacity:.25;pointer-events:none}
.ib svg{width:18px;height:18px}
.addbtn{margin-top:10px;display:flex;gap:8px;justify-content:center;align-items:center;min-height:48px}
.addbtn svg{width:18px;height:18px}
.btn.danger{color:var(--danger);display:flex;gap:8px;align-items:center;justify-content:center}
.btn.danger svg{width:18px;height:18px}
.ahead{position:sticky;top:0;z-index:2;margin:0 -18px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.aback{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 8px;font-weight:600;color:var(--goldInk)}
.aback svg{width:22px;height:22px}
.atitle{font-size:26px;font-weight:800;margin:4px 0 14px;letter-spacing:-.01em}
.asave{display:grid;gap:10px;margin-top:26px}
.field.ta textarea{width:100%;padding:24px 15px 10px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);font:500 16px/1.45 Montserrat,system-ui,sans-serif;color:var(--ink);outline:none;resize:vertical;min-height:58px;transition:border-color var(--t-press) ease}
.field.ta textarea:focus{border-color:var(--ink)}
.field.ta textarea:focus + span,.field.ta textarea:not(:placeholder-shown) + span{transform:translateY(-10px) scale(.74)}
.field.sel select{width:100%;height:56px;padding:20px 14px 4px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);font:500 16px Montserrat,system-ui,sans-serif;color:var(--ink);-webkit-appearance:none;appearance:none}
.field.sel span{transform:translateY(-10px) scale(.74)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:10px}
.fgrid .field.off input{opacity:.6}
@media(max-width:360px){.fgrid{grid-template-columns:1fr}}
.ythint{font-size:13px;margin:-4px 4px 8px;color:var(--mute)}
.ythint.ok{color:var(--ok)}.ythint.bad{color:var(--danger)}
.prog .pdot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mute);box-shadow:inset 0 0 0 1.5px var(--line2);flex:none;transition:background-color 200ms ease,color 200ms ease}
.prog .pdot svg{width:15px;height:15px}
.prog .pdot path{stroke-dashoffset:0}
.prog.d .pdot{background:var(--gold);color:var(--onGold);box-shadow:none}
.prog.c .pdot{box-shadow:inset 0 0 0 2px var(--gold);color:var(--ink)}
.prog.d .amain b{color:var(--mute);font-weight:600}
.prow .avatar{width:42px;height:42px}
.chev.rot{transform:rotate(-90deg)}
.nt{color:var(--faint);font-weight:500;font-size:12px;margin-left:auto}
.ncard{padding:16px}

  const [adm, cfg, ps] = await Promise.all([sb.rpc('is_admin'), sb.from('app_config').select('data').eq('id', 1).maybeSingle(), sb.from('players').select('*').order('created_at')]);
  if(ps.error) throw ps.error;
  isAdmin = !!adm.data;
  const c = (cfg.data && cfg.data.data) || {};
  if(c.paths) D.paths = c.paths;
  if(c.global) D.global = c.global;
  FIELDS.splice(0, FIELDS.length, ...(c.fields || []));
  D.players = (ps.data || []).map(r => Object.assign(r, {f:r.f || {}, links:r.links || [], raw:r.raw || {}, docs:r.docs || []}));
  snap.cfg = c.paths ? JSON.stringify(cfgOf()) : '';
  snap.players = Object.fromEntries(D.players.map(p => [p.id, JSON.stringify(toDb(p))]));
  if(isAdmin && !c.paths) persist();
  const mine = D.players.find(p => p.user_id === user.id);
  session = {email:user.email, pid:mine ? mine.id : (isAdmin ? null : (D.players[0] ? D.players[0].id : null)), own:!!mine};
  return true;
}
let persistT;
function saveD(){
  if(!CLOUD){ LS.set('nxt_data6', D); return; }
  clearTimeout(persistT); persistT = setTimeout(persist, 450);
}
async function persist(){
  if(!CLOUD) return;
  try{
    if(isAdmin){
      const c = JSON.stringify(cfgOf());
      if(c !== snap.cfg){ const {error} = await sb.from('app_config').upsert({id:1, data:cfgOf()}); if(error) throw error; snap.cfg = c; }
      const ch = D.players.map(toDb).filter(r => JSON.stringify(r) !== snap.players[r.id]);
      if(ch.length){ const {error} = await sb.from('players').upsert(ch); if(error) throw error; ch.forEach(r => snap.players[r.id] = JSON.stringify(r)); }
    } else {
      const p = D.players.find(x => x.user_id === (cloudUser && cloudUser.id)); if(!p) return;
      const r = JSON.stringify(toDb(p)); if(r === snap.players[p.id]) return;
      const patch = Object.fromEntries(FIELDS.filter(f => f.v).map(f => [f.k, p.f[f.k] || '']));
      const {error} = await sb.rpc('update_my_fields', {patch}); if(error) throw error; snap.players[p.id] = r;
    }
  }catch(e){ console.error(e); toast(tx('Speichern hat nicht geklappt. Bitte Verbindung prüfen.','Saving failed. Please check your connection.')); }
}
async function adminCall(action, body){
  if(!CLOUD) return {demo:true};
  // Runs as a Supabase Edge Function; supabase-js sends the admin's login token along
  const {data, error} = await sb.functions.invoke('admin-users', {body:Object.assign({action}, body)});
  if(error){ let m = error.message; try{ const j = await error.context.json(); if(j && j.error) m = j.error; }catch(e){}
    if(/Failed to send|fetch/i.test(m)) m = tx('Admin-Funktion nicht erreichbar. Ist sie in Supabase eingerichtet?','Admin function not reachable. Is it set up in Supabase?');
    throw new Error(m); }
  return data || {};
}

}
const genPw = () => { const a = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const r = new Uint32Array(12); crypto.getRandomValues(r); return [...r].map(x => a[x % a.length]).join('').replace(/(.{4})(?!$)/g, '$1-'); };

/* ============ Media: photos (max 7, original quality) and documents ============ */
const MEDIA = {
  max:7, maxBytes:25 * 1024 * 1024,
  async list(bucket, pid){
    if(CLOUD){ const {data, error} = await sb.storage.from(bucket).list(pid, {limit:100, sortBy:{column:'created_at', order:'asc'}}); if(error) throw error;
      return (data || []).filter(o => o.id && o.name && o.name !== '.emptyFolderPlaceholder').map(o => ({name:o.name, path:pid + '/' + o.name, size:o.metadata && o.metadata.size})); }
    const keys = await idb.keys(); const pre = bucket + '/' + pid + '/';
    return keys.filter(k => String(k).startsWith(pre)).sort().map(k => ({name:k.slice(pre.length), path:k.slice(bucket.length + 1)}));
  },
  async upload(bucket, pid, file, tag=''){
    const name = Date.now().toString(36) + '-' + tag + (file.name || 'datei').replace(/[^\w.\-]+/g, '_').slice(-80);
    if(CLOUD){ const {error} = await sb.storage.from(bucket).upload(pid + '/' + name, file, {contentType:file.type || undefined, upsert:false, cacheControl:'3600'}); if(error) throw error; }
    else await idb.put(bucket + '/' + pid + '/' + name, file);
    return {name, path:pid + '/' + name};
  },
  async put(bucket, path, blob){
    if(CLOUD){ const {error} = await sb.storage.from(bucket).upload(path, blob, {contentType:blob.type || 'image/jpeg', upsert:true, cacheControl:'86400'}); if(error) throw error; }
    else await idb.put(bucket + '/' + path, blob);
  },
  async remove(bucket, path){ if(CLOUD){ const {error} = await sb.storage.from(bucket).remove([path]); if(error) throw error; } else await idb.del(bucket + '/' + path); },
  _u:new Map(),
  async urls(bucket, paths){
    if(!paths.length) return {};
    if(CLOUD){
      // Signed links are reused for 50 minutes, so the browser cache can do its job while the app is open
      const now = Date.now(), out = {}, need = [];
      for(const p of paths){ const c = this._u.get(bucket + '/' + p); if(c && c.t > now) out[p] = c.u; else need.push(p); }
      if(need.length){ const {data} = await sb.storage.from(bucket).createSignedUrls(need, 3600);
        for(const d of data || []) if(d.signedUrl){ out[d.path] = d.signedUrl; this._u.set(bucket + '/' + d.path, {u:d.signedUrl, t:now + 3e6}); } }
      return out; }
    const out = {}; for(const p of paths){ const b = await idb.get(bucket + '/' + p); if(b) out[p] = URL.createObjectURL(b); } return out;
  },
  async blob(bucket, path){ if(CLOUD){ const {data, error} = await sb.storage.from(bucket).download(path); if(error) throw error; return data; } return idb.get(bucket + '/' + path); }
};
const niceName = n => String(n).replace(/^[a-z0-9]{6,10}-/, '').replace(/^c\d+x\d+x\d+x\d+x\d+-/, '');
const fmtSize = b => !b ? '' : b > 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

/* ============ Square crop by zoom & pan. The original stays untouched; the crop is stored in the file name ============ */
const cropTag = c => c ? `c${[c.x, c.y, c.L, c.NW, c.NH].map(v => Math.max(0, Math.round(v))).join('x')}-` : '';
const cropOf = name => { const m = String(name).match(/-c(\d+)x(\d+)x(\d+)x(\d+)x(\d+)-/); return m ? {x:+m[1], y:+m[2], L:+m[3], NW:+m[4], NH:+m[5]} : null; };
const thumbStyle = (url, name) => {
  const c = cropOf(name);
  if(!c || !c.L) return `background-image:url('${url}');background-size:cover;background-position:center`;
  const pos = (v, full) => full - c.L > 0 ? (v / (full - c.L) * 100).toFixed(2) + '%' : '50%';
  return `background-image:url('${url}');background-size:${(c.NW / c.L * 100).toFixed(2)}% ${(c.NH / c.L * 100).toFixed(2)}%;background-position:${pos(c.x, c.NW)} ${pos(c.y, c.NH)}`;
};
/* Small copies for display: a square thumb (512 px) for the gallery and a view copy (max 1600 px) for the lightbox.
   The original is only fetched when someone downloads it. Saves well over 90 % of the transfer. */
async function makePreviews(file, crop){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const NW = img.naturalWidth, NH = img.naturalHeight, m = Math.min(NW, NH);
    const c = crop && crop.L ? crop : {x:(NW - m) / 2, y:(NH - m) / 2, L:m};
    const enc = (w, h, draw) => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d'); g.imageSmoothingQuality = 'high'; draw(g);
      return new Promise(r => cv.toBlob(b => { cv.width = cv.height = 0; r(b); }, 'image/jpeg', 0.82)); };
    const T = Math.round(Math.min(512, c.L));
    const thumb = await enc(T, T, g => g.drawImage(img, c.x, c.y, c.L, c.L, 0, 0, T, T));
    const k = Math.min(1, 1600 / Math.max(NW, NH)), vw = Math.round(NW * k), vh = Math.round(NH * k);
    const view = await enc(vw, vh, g => g.drawImage(img, 0, 0, vw, vh));
    return thumb && view ? {thumb, view} : null;
  }catch(e){ return null; }
  finally{ URL.revokeObjectURL(url); }
}
const prevPath = (kind, path) => path.replace(/([^/]+)$/, kind + '-$1');
function cropFile(file, idx, total){
  return new Promise(resolve => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); resolve({file, crop:null}); };   // e.g. HEIC outside Safari: centered automatically
    img.onload = () => {
      const NW = img.naturalWidth, NH = img.naturalHeight; let done = false;
      openSheet(`<h3>${tx('Ausschnitt wählen','Choose the frame')}${total > 1 ? ` <small class="cnum">${idx + 1}/${total}</small>` : ''}</h3>
        <p class="sub" style="font-size:14px">${tx('Zoomen und verschieben. Gespeichert wird trotzdem das ganze Foto.','Zoom and drag. The full photo is still saved.')}</p>
        <div class="zstage" id="zst"><img src="${url}" alt="" draggable="false"><i class="zgrid"></i></div>
        <div class="zrow"><span aria-hidden="true">−</span><input type="range" id="zr" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><span aria-hidden="true">+</span></div>
        <div class="lbtns"><button type="button" class="btn ghost" id="cskip">${tx('Überspringen','Skip')}</button><button type="button" class="btn gold" id="cok">${tx('Übernehmen','Use this')}</button></div>`,
      (sh, closeFn) => {
        const st = $('#zst', sh), im = $('img', st), zr = $('#zr', sh);
        let side = 300, base = 1, z = 1, ox = 0, oy = 0;
        const clamp = () => { const s = base * z, w = NW * s, h = NH * s; ox = Math.min(0, Math.max(side - w, ox)); oy = Math.min(0, Math.max(side - h, oy)); };
        const paint = () => { clamp(); const s = base * z; im.style.width = NW * s + 'px'; im.style.height = NH * s + 'px'; im.style.transform = `translate(${ox}px,${oy}px)`; };
        const layout = () => { const cx = (side / 2 - ox) / (base * z), cy = (side / 2 - oy) / (base * z); side = st.clientWidth; base = side / Math.min(NW, NH);
          if(isFinite(cx) && im.style.width){ ox = side / 2 - cx * base * z; oy = side / 2 - cy * base * z; } else { ox = (side - NW * base) / 2; oy = (side - NH * base) / 2; } paint(); };
        const zoomAt = (nz, px, py) => { nz = Math.min(4, Math.max(1, nz)); const k = nz / z; ox = px - (px - ox) * k; oy = py - (py - oy) * k; z = nz; zr.value = z; paint(); };
        zr.oninput = () => zoomAt(+zr.value, side / 2, side / 2);
        const pts = new Map(); let last = null, pinch = null;
        st.addEventListener('pointerdown', e => { st.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); last = {x:e.clientX, y:e.clientY};
          if(pts.size === 2){ const [a, b] = [...pts.values()]; pinch = {d:Math.hypot(a.x - b.x, a.y - b.y), z}; } });
        st.addEventListener('pointermove', e => { if(!pts.has(e.pointerId)) return; pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
          const r = st.getBoundingClientRect();
          if(pts.size === 2 && pinch){ const [a, b] = [...pts.values()]; zoomAt(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); return; }
          ox += e.clientX - last.x; oy += e.clientY - last.y; last = {x:e.clientX, y:e.clientY}; paint(); });
        const up = e => { pts.delete(e.pointerId); pinch = null; const v = [...pts.values()][0]; if(v) last = v; };
        st.addEventListener('pointerup', up); st.addEventListener('pointercancel', up);
        st.addEventListener('wheel', e => { e.preventDefault(); const r = st.getBoundingClientRect(); zoomAt(z * Math.exp(-e.deltaY * .0015), e.clientX - r.left, e.clientY - r.top); }, {passive:false});
        st.addEventListener('dblclick', e => { const r = st.getBoundingClientRect(); zoomAt(z > 1.5 ? 1 : 2, e.clientX - r.left, e.clientY - r.top); });
        const ro = new ResizeObserver(layout); ro.observe(st);
        const finish = out => { if(done) return; done = true; ro.disconnect(); closeFn(); setTimeout(() => URL.revokeObjectURL(url), 1000); resolve(out); };
        $('#cskip', sh).onclick = () => finish({file, crop:null});
        $('#cok', sh).onclick = () => { const s = base * z; finish({file, crop:{x:-ox / s, y:-oy / s, L:side / s, NW, NH}}); };
        const obs = new MutationObserver(() => { if(!sh.isConnected && !done){ done = true; obs.disconnect(); ro.disconnect(); URL.revokeObjectURL(url); resolve(null); } });
        obs.observe($('#layer'), {childList:true});
      });
    };
    img.src = url;
  });
}

function mediaBlock(holder, p, opts={}){
  const canEdit = opts.canEdit !== false;
  holder.innerHTML = `<section class="mblock">
      <div class="mhead"><h2>${tx('Fotos','Photos')}</h2><span class="mcount" id="mc"></span></div>
      <div class="gal" id="gal"><div class="gsk"></div><div class="gsk"></div><div class="gsk"></div></div>
      <input type="file" accept="image/*" multiple class="sr" id="gin">
      <div class="mhead"><h2>${tx('Dokumente','Documents')}</h2></div>
      <div class="grp alist" id="docs"><div class="arow empty-row">…</div></div>
      ${canEdit ? `<button class="btn ghost wide addbtn" id="dadd">${AI.plus}<span>${tx('Dokument hochladen','Upload document')}</span></button>` : ''}
      <input type="file" accept=".pdf,.doc,.docx,image/*" multiple class="sr" id="din">
      <input type="file" accept=".pdf,.doc,.docx,image/*" class="sr" id="gdin"></section>`;
  let imgs = [], urls = {}, th = {}, vw = {};
  const gal = $('#gal', holder), gin = $('#gin', holder), din = $('#din', holder);
  const drawGal = () => {
    $('#mc', holder).textContent = `${imgs.length}/${MEDIA.max}`;
    gal.innerHTML = imgs.map((m, i) => `<button class="gimg" data-i="${i}" aria-label="${tx('Foto','Photo')} ${i+1}"><span class="gth" style="${esc(th[m.path] ? `background-image:url('${th[m.path]}');background-size:cover;background-position:center` : thumbStyle(urls[m.path] || '', m.name))}"></span></button>`).join('')
      + (canEdit && imgs.length < MEDIA.max ? `<button class="gadd" id="gadd">${AI.plus}<span>${imgs.length ? tx('Foto hinzufügen','Add photo') : tx('Fotos hochladen','Upload photos')}</span></button>` : '')
      + (!canEdit && !imgs.length ? `<p class="small">${tx('Noch keine Fotos','No photos yet')}</p>` : '');
    $$('.gimg', gal).forEach(b => b.onclick = () => lightbox(+b.dataset.i));
    const ga = $('#gadd', gal); if(ga) ga.onclick = () => gin.click();
  };
  const loadImgs = async () => {
    try{
      imgs = await MEDIA.list('player-images', p.id);
      const pv = await MEDIA.urls('player-thumbs', imgs.flatMap(m => [prevPath('t', m.path), prevPath('v', m.path)]));
      th = {}; vw = {}; imgs.forEach(m => { if(pv[prevPath('t', m.path)]) th[m.path] = pv[prevPath('t', m.path)]; if(pv[prevPath('v', m.path)]) vw[m.path] = pv[prevPath('v', m.path)]; });
      // Only photos without small copies (uploaded before, or the browser couldn't read them) fall back to the original
      urls = await MEDIA.urls('player-images', imgs.filter(m => !th[m.path] || !vw[m.path]).map(m => m.path));
    }catch(e){ imgs = []; }
    drawGal(); };
  const loadDocs = async () => {
    let docs = []; try{ docs = await MEDIA.list('player-docs', p.id); }catch(e){}
    // Files Notion only links to (the PDF wasn't in the import). Only admins see them, with upload and remove.
    const nn = n => String(n).toLowerCase().replace(/[\s_]+/g, ' ').trim();
    const missing = isAdmin ? (p.docs || []).filter(d => !d.stored && !d.hidden && !docs.some(x => nn(niceName(x.name)) === nn(d.name))) : [];

      + missing.map((d, i) => `<div class="arow ghost"><span class="dicon">${I.doc}</span><span class="amain"><b>${esc(d.name)}</b><small>${tx('Steht in Notion, Datei fehlt noch','Listed in Notion, file still missing')}</small></span>
        <button class="ib" data-gup="${i}" aria-label="${tx('Datei hochladen','Upload file')}">${AI.plus}</button><button class="ib del" data-gdel="${i}" aria-label="${tx('Entfernen','Remove')}">${AI.trash}</button></div>`).join('')

      setTimeout(async () => { if(undone) return; try{ await MEDIA.remove('player-docs', d.path); }catch(e){ toast(tx('Löschen hat nicht geklappt','Delete failed')); loadDocs(); } }, 5400); });
  };
  gin.onchange = async () => {
    const files = [...gin.files]; gin.value = ''; if(!files.length) return;
    const room = MEDIA.max - imgs.length;
    if(files.length > room) toast(tx(`Maximal ${MEDIA.max} Fotos. ${room} ${room === 1 ? 'Platz' : 'Plätze'} frei.`, `Up to ${MEDIA.max} photos. ${room} left.`));
    const ok = files.slice(0, room).filter(f => { if(f.size > MEDIA.maxBytes){ toast(tx(`${f.name} ist größer als 25 MB`, `${f.name} is larger than 25 MB`)); return false; } return /^image\//.test(f.type) || /\.(heic|heif)$/i.test(f.name); });
    if(!ok.length) return;
    const ready = [];
    for(let i = 0; i < ok.length; i++){ const r = await cropFile(ok[i], i, ok.length); if(r) ready.push(r); }
    if(!ready.length) return;
    const ga = $('#gadd', gal); if(ga){ ga.classList.add('busy'); ga.innerHTML = `<span class="spin"></span><span>${tx('Lädt hoch …','Uploading …')}</span>`; }
    let n = 0; for(const r of ready){ try{
      const up = await MEDIA.upload('player-images', p.id, r.file, cropTag(r.crop)); n++;
      const pv = await makePreviews(r.file, r.crop);
      if(pv){ try{ await MEDIA.put('player-thumbs', prevPath('t', up.path), pv.thumb); await MEDIA.put('player-thumbs', prevPath('v', up.path), pv.view); }catch(e){} }
    }catch(e){ toast(tx('Upload fehlgeschlagen: ','Upload failed: ') + (e.message || '')); } }
    await loadImgs(); if(n) toast(n === 1 ? tx('Foto hochgeladen','Photo uploaded') : tx(`${n} Fotos hochgeladen`, `${n} photos uploaded`));
  };
  const da = $('#dadd', holder); if(da) da.onclick = () => din.click();
  din.onchange = async () => {
    const files = [...din.files]; din.value = ''; if(!files.length) return;
    const btn = $('#dadd', holder); btn.disabled = true; btn.querySelector('span').textContent = tx('Lädt hoch …','Uploading …');
    for(const f of files){ if(f.size > MEDIA.maxBytes){ toast(tx(`${f.name} ist größer als 25 MB`, `${f.name} is larger than 25 MB`)); continue; }
      try{ await MEDIA.upload('player-docs', p.id, f); }catch(e){ toast(tx('Upload fehlgeschlagen: ','Upload failed: ') + (e.message || '')); } }
    btn.disabled = false; btn.querySelector('span').textContent = tx('Dokument hochladen','Upload document'); loadDocs(); toast(tx('Hochgeladen','Uploaded'));
  };
  function lightbox(start){
    const lb = document.createElement('div'); lb.className = 'lb'; lb.setAttribute('role','dialog'); lb.setAttribute('aria-label', tx('Fotos','Photos'));

  el.innerHTML = `<span class="ti">${I.check}</span><span>${esc(msg)}</span>${action?`<button>${esc(action.label)}</button><i class="bar2"></i>`:''}`;

/* ============ Confetti (milestones only) ============ */
function confetti(x, y){
  if(RM) return;
  const c = document.createElement('canvas'); c.className = 'fx'; document.body.appendChild(c);
  const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight; c.width = W*dpr; c.height = H*dpr;
  const g = c.getContext('2d'); g.scale(dpr,dpr);
  const cols = ['#E8BB3D','#F5D57A','#F4F3EF','#B8871A'];
  const P = Array.from({length:90}, () => { const a = -Math.PI/2 + (Math.random()-.5)*2.2, v = 6 + Math.random()*8;
    return {x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, r:Math.random()*6+3, rot:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[Math.random()*4|0], s:Math.random()<.4} });
  const t0 = performance.now();
  (function f(now){
    const k = (now - t0)/1800; g.clearRect(0,0,W,H);
    P.forEach(p => { p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      g.save(); g.globalAlpha = Math.max(0, 1-k); g.translate(p.x,p.y); g.rotate(p.rot); g.fillStyle = p.c;
      if(p.s){ g.beginPath(); g.arc(0,0,p.r/2,0,7); g.fill() } else g.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); g.restore(); });
    if(k < 1) requestAnimationFrame(f); else c.remove();
  })(t0);
}

/* ============ Async button helper (spinner only after 300ms, held 500ms) ============ */
function busy(btn, work, ms=900){
  if(btn.dataset.s === 'busy') return Promise.resolve();
  btn.dataset.s = 'busy-pending'; btn.disabled = true;
  let shownAt = 0;
  const sp = setTimeout(() => { btn.dataset.s = 'busy'; shownAt = performance.now(); }, 300);
  return new Promise(res => setTimeout(res, ms)).then(work).then(async ok => {
    clearTimeout(sp);
    if(shownAt){ const w = 500 - (performance.now() - shownAt); if(w > 0) await new Promise(r => setTimeout(r, w)); }
    if(ok === false){ btn.dataset.s = ''; btn.disabled = false; return false; }
    btn.dataset.s = 'ok'; await new Promise(r => setTimeout(r, 650));
    return true;
  });
}

/* ---------- Pathway: one glass vessel (tube + bulbs), one liquid level ---------- */
const VX = 22, TW = 12, BR = 15;
const WAVE = (() => { let d = 'M-44 0'; for(let x = -44; x < 88; x += 11) d += ` Q${x+5.5} ${((x+44)/11)%2 ? 2.2 : -2.2} ${x+11} 0`; return d + ' V3000 H-44Z'; })();

  m.innerHTML = `

    <div class="ph"><div><p class="sub st" style="--i:0">${t('hi')} ${esc(p.name.split(' ')[0])}</p>
      <h1 class="st" style="--i:1">${t('pathT')}</h1>
      <p class="sub st" style="--i:2">${cur >= 0 ? t('stepOf',{a:done+1,b:N}) : t('finished')}</p></div>
      <div class="pct num st" style="--i:3" aria-label="${pct}%"><span id="pctn">0</span><small>%</small></div></div>
    <section class="path" id="path">
      <svg class="vessel" id="ves" width="44" aria-hidden="true">
        <defs>
          <clipPath id="vclip"></clipPath>
          <linearGradient id="lqV" gradientUnits="userSpaceOnUse" x1="0" y1="-2" x2="0" y2="320"><stop offset="0" stop-color="#FBE08A"/><stop offset=".05" stop-color="#EDC24A"/><stop offset=".45" stop-color="#D3A12A"/><stop offset="1" stop-color="#A8770E"/></linearGradient>
          <linearGradient id="tubeSh" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset=".28" stop-color="#000" stop-opacity="0"/><stop offset=".42" stop-color="#fff" stop-opacity=".32"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset=".78" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></linearGradient>
          <radialGradient id="bulbSh" cx=".38" cy=".34" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset=".7" stop-color="#000" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
        </defs>
        <g class="sh-o"></g><g class="sh-f"></g>
        <g clip-path="url(#vclip)">
          <g id="lq" transform="translate(0,3000)">
            <g class="w2"><path d="${WAVE}" fill="#A87810"/></g>
            <g class="w1"><path d="${WAVE}" fill="url(#lqV)"/><path d="${WAVE.replace(/ V3000 H-44Z$/,'')}" fill="none" stroke="#FFE9A6" stroke-width="1.2" opacity=".9"/></g>
            <g class="bubs">${[[18,0,3.1,1.1],[25,1.1,3.7,.8],[21,2.2,2.6,1.3],[16,.6,4.2,.9],[27,1.8,3.3,1]].map(([x,d,du,r]) => `<circle cx="${x}" cy="0" r="${r}" style="animation-delay:${d}s;animation-duration:${du}s"/>`).join('')}</g>

    </section>`;
  const cards = $$('.task', m).reverse();
  cards.forEach((c, k) => { c.classList.add('st'); c.style.setProperty('--i', 4 + Math.min(k, 10)); });
  $$('.task .hd', m).forEach(h => h.onclick = () => { const a = h.closest('.task'); a.classList.toggle('open'); h.setAttribute('aria-expanded', a.classList.contains('open')); });

  const path = $('#path', m), svg = $('#ves', m), lq = $('#lq', svg);
  const byI = i => $(`.task[data-i="${i}"]`, path);
  let G = null, sy = 0, kNow = 0, filled = new Set();
  // geometry from offsets (unaffected by entrance transforms)
  function measure(){
    const Y = STEPS.map((_, i) => { const a = byI(i), h = $('.hd', a); return a.offsetTop + h.offsetTop + h.offsetHeight/2; });
    return {Y, top:Y[N-1], bot:Y[0], H:path.offsetHeight};
  }
  function draw(g){
    const w = TW/2, dy = Math.sqrt(BR*BR - w*w), ex = 9.6, ey = Math.sqrt(BR*BR - ex*ex);
    const neck = (y, dir) => `<path d="M${VX-w} ${y + dir*(dy+5)} C${VX-w} ${y + dir*(dy+1)} ${VX-w-1.6} ${y + dir*(ey+.8)} ${VX-ex} ${y + dir*ey} L${VX+ex} ${y + dir*ey} C${VX+w+1.6} ${y + dir*(ey+.8)} ${VX+w} ${y + dir*(dy+1)} ${VX+w} ${y + dir*(dy+5)} Z"/>`;
    const necks = g.Y.map((y, i) => (i < g.Y.length-1 ? neck(y, -1) : '') + (i > 0 ? neck(y, 1) : '')).join('');
    const shapes = `<rect x="${VX-TW/2}" y="${g.top}" width="${TW}" height="${g.bot-g.top}"/>` + necks + g.Y.map(y => `<circle cx="${VX}" cy="${y}" r="${BR}"/>`).join('');

    $('.sh-o', svg).innerHTML = shapes; $('.sh-f', svg).innerHTML = shapes;
    const segs = g.Y.slice(0,-1).map((y, i) => [g.Y[i+1] + BR*.82, y - BR*.82]);
    $('.ov', svg).innerHTML = segs.map(([y0,y1]) => `<rect x="${VX-TW/2}" y="${y0}" width="${TW}" height="${Math.max(0,y1-y0)}" fill="url(#tubeSh)"/>`).join('') + g.Y.map(y => `<circle cx="${VX}" cy="${y}" r="${BR}" fill="url(#bulbSh)"/>`).join('');
    $('.hl', svg).innerHTML = segs.map(([y0,y1]) => y1 - y0 > 6 ? `<path d="M${VX-3.2} ${y0+3} V${y1-3}" stroke="rgba(255,255,255,.28)" stroke-width="1.4" stroke-linecap="round"/>` : '').join('') +
      g.Y.map(y => `<path d="M${VX-BR*.72} ${y-BR*.22} A${BR*.76} ${BR*.76} 0 0 1 ${VX-BR*.18} ${y-BR*.74}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.6" stroke-linecap="round"/><circle cx="${VX+BR*.36}" cy="${y+BR*.42}" r="1.1" fill="rgba(255,255,255,.35)"/>`).join('');
    $('.lab', svg).innerHTML = g.Y.map((y, i) => `<g class="lb ${filled.has(i)?'on':''} ${i===cur?'cur':''}" data-l="${i}">
        ${i===cur ? `<circle class="pulse" cx="${VX}" cy="${y}" r="${BR}"/>` : ''}
        <text x="${VX}" y="${y+4}">${i+1}</text>
        <path pathLength="1" d="M${VX-5} ${y+.5} l3.4 3.4 L${VX+5.4} ${y-4}"/></g>`).join('');
  }
  function target(g){ return cur >= 0 ? g.Y[cur] : g.top - BR - 4; }
  function setLevel(g, k){
    const start = g.bot + BR + 3, tg = target(g);
    sy = start - k * (start - tg);
    lq.setAttribute('transform', `translate(0,${sy})`);

    g.Y.forEach((y, i) => {

  const dur = RM ? 0 : 1700 + done * 110, delay = RM ? 0 : 520;

    const t0 = performance.now();
    (function f(now){

        seen['prog_'+p.id] = done; LS.set('nxt_seen', seen); }
    })(t0);
  }, delay);

  const ro = new ResizeObserver(() => { if(!svg.isConnected){ ro.disconnect(); return; } G = measure(); draw(G); setLevel(G, kNow); });
  ro.observe(path);
}

function countUp(el, a, b, dur, out){
  if(!el) return;
  if(RM || dur < 50){ el.textContent = b; return; }
  const t0 = performance.now();
  (function f(now){ const k = Math.min(1, (now - t0)/dur), e = out ? 1 - Math.pow(1 - k, 3) : k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k+2,3)/2;
    el.textContent = Math.round(a + (b - a)*e); if(k < 1) requestAnimationFrame(f); })(t0);
}

function openSheet(html, onReady){
  const layer = $('#layer');
  layer.innerHTML = `<div class="scrim"></div><div class="sheet glass" role="dialog" aria-modal="true"><span class="grab" aria-hidden="true"></span>${html}</div>`;
  const sc = $('.scrim', layer), sh = $('.sheet', layer);
  requestAnimationFrame(() => { sc.classList.add('on'); sh.classList.add('on'); setTimeout(() => sh.classList.add('settled'), 300); });
  const close = () => {
    $('#gear')?.classList.remove('on');
    sh.classList.add('closing'); sh.classList.remove('on'); sc.classList.remove('on');
    setTimeout(() => { if(sh.parentNode === layer) layer.innerHTML = ''; }, 240); document.removeEventListener('keydown', esck);
  };
  const esck = e => { if(e.key === 'Escape') close(); };
  document.addEventListener('keydown', esck);
  sc.onclick = close;
  // drag to dismiss: 1:1 under the finger, rubber band upward, spring back or close on release
  const g = $('.grab', sh); let y0 = 0, dy = 0, t0 = 0, drag = false;
  g.onpointerdown = e => { drag = true; y0 = e.clientY; t0 = performance.now(); sh.classList.add('drag'); g.setPointerCapture(e.pointerId); };
  g.onpointermove = e => { if(!drag) return; dy = e.clientY - y0; const v = dy < 0 ? -Math.sqrt(-dy)*2 : dy; sh.style.transform = `translate(-50%, ${v}px)`; };
  g.onpointerup = g.onpointercancel = () => { if(!drag) return; drag = false; sh.classList.remove('drag');
    const vel = dy / Math.max(1, performance.now() - t0); sh.style.transform = '';
    if(dy > 110 || vel > .6) close(); dy = 0; };
  onReady(sh, close);
  return close;
}

const SKIP_PROPS = ['name','nachname','email','e-mail'];

    else { const sel = [...td.querySelectorAll('.selected-value, .status-value')].map(x => clean(x.textContent)); value = sel.length ? sel.join(', ') : clean(td.textContent); }
    if(value) props.push({name, value});
  });

}
function fieldFor(prop, res){
  const n = prop.toLowerCase();

  if(!f){ let k = 'n_' + slug(prop), j = 2; while(FIELDS.find(x => x.k === k)) k = 'n_' + slug(prop) + '_' + j++;
    f = {k, n:prop, l:'', v:defaultVisible(prop)}; FIELDS.push(f); res && res.newFields.push(prop); }

}
async function importNotion(fileList){
  const files = [...fileList], htmls = files.filter(f => /\.html?$/i.test(f.name)), pdfs = files.filter(f => !/\.html?$/i.test(f.name));
  const res = {created:[], filled:[], kept:[], docs:0, skipped:[], newFields:[]};
  for(const file of htmls){
    let data; try{ data = parseNotionHTML(await file.text()); }catch(e){ res.skipped.push(file.name); continue; }
    if(!data.props.length || !data.name){ res.skipped.push(file.name); continue; }
    let p = (data.email && D.players.find(x => (x.email||'').toLowerCase() === data.email)) || D.players.find(x => x.name.toLowerCase() === data.name.toLowerCase());
    const isNew = !p;
    if(isNew){ p = {id:uid(), email:data.email, name:data.name, done:0, yt:'', transfer:false, f:{}, links:[], docs:[], raw:{}}; D.players.push(p); }
    p.raw = p.raw || {}; p.docs = p.docs || [];
    if(!p.email && data.email) p.email = data.email;
    const added = [];
    data.props.forEach(({name, value}) => {
      if(!p.raw[name]) p.raw[name] = value;
      if(SKIP_PROPS.includes(name.toLowerCase()) || /contract|vertrag/i.test(name) && data.files.some(x => x.prop === name)) return;
      if(/highlight/i.test(name) && ytId(value) && !p.yt) p.yt = 'https://youtu.be/' + ytId(value);
      const f = fieldFor(name, res), v = value, cur = (p.f[f.k] || '').trim();
      if(!cur){ p.f[f.k] = v; added.push(flabel(f)); }
      else if(cur !== v) res.kept.push({n:p.name, l:flabel(f), app:cur, notion:v});
    });
    data.files.forEach(({prop, file}) => { if(!p.docs.find(d => d.name === file)) p.docs.push({name:file, label:prop}); });
    if(isNew && !p.transfer){ const st = pathOf(p), idxOf = rx => { const i = st.findIndex(s => rx.test(s.t.de || '')); return i < 0 ? 0 : i + 1; };
      const paid = data.props.find(x => /^paid/i.test(x.name))?.value === 'Ja', status = data.props.find(x => /^status$/i.test(x.name))?.value || '';
      p.done = /whole process complete/i.test(status) ? idxOf(/commitment/i) : paid ? idxOf(/zahlung/i) : /contract signed/i.test(status) ? idxOf(/vertrag/i) : 0; }
    if(isNew) res.created.push(p.name); else if(added.length) res.filled.push({n:p.name, what:added});
  }
  saveD(); if(CLOUD){ clearTimeout(persistT); await persist(); }
  const norm = n => String(n).toLowerCase().replace(/[\s_]+/g, ' ').trim();
  for(const pdf of pdfs){

    if(!owner){ res.skipped.push(pdf.name); continue; }
    const d = owner.docs.find(d => norm(d.name) === norm(pdf.name));
    if(d.stored) continue;
    try{ await MEDIA.upload('player-docs', owner.id, pdf); d.stored = true; res.docs++; }catch(e){ res.skipped.push(pdf.name); }
  }
  saveD();
  return res;
}
function exportNotionHTML(p){

const FI = {

function fieldManager(holder){
  const draw = () => {
    if(!FIELDS.length){ holder.innerHTML = `<div class="grp"><div class="arow empty-row">${tx('Noch keine Felder. Sie kommen automatisch mit dem ersten Notion-Import.','No fields yet. They arrive with your first Notion import.')}</div></div>`; return; }
    holder.innerHTML = `<div class="grp alist flist">${FIELDS.map((f, i) => `<div class="frow ${f.v ? '' : 'hid'}" data-id="${f.k}" data-i="${i}">
        <button class="ib grip" data-grip="${i}" aria-label="${tx('Verschieben (Pfeiltasten)','Move (arrow keys)')}">${FI.grip}</button>
        <span class="fl"><b>${esc(flabel(f))}</b>${f.l && f.l !== f.n ? `<small>Notion: ${esc(f.n)}</small>` : ''}</span>
        <button class="ib" data-ren="${i}" aria-label="${tx('Umbenennen','Rename')}">${AI.edit}</button>
        <button class="ib eyeb ${f.v ? 'on' : ''}" data-eye="${i}" aria-pressed="${!!f.v}" aria-label="${f.v ? tx('Für Spieler sichtbar','Visible to players') : tx('Für Spieler ausgeblendet','Hidden from players')}">${f.v ? FI.eye : FI.eyeOff}</button>
      </div>`).join('')}</div>`;
    const list = $('.flist', holder);
    $$('[data-eye]', list).forEach(x => x.onclick = () => { const f = FIELDS[+x.dataset.eye]; f.v = !f.v; saveD();
      const row = x.closest('.frow'); row.classList.toggle('hid', !f.v); x.classList.toggle('on', f.v); x.setAttribute('aria-pressed', f.v); x.innerHTML = f.v ? FI.eye : FI.eyeOff;
      x.setAttribute('aria-label', f.v ? tx('Für Spieler sichtbar','Visible to players') : tx('Für Spieler ausgeblendet','Hidden from players')); });
    $$('[data-ren]', list).forEach(x => x.onclick = () => rename(+x.dataset.ren));
    $$('[data-grip]', list).forEach(g => g.addEventListener('keydown', e => {
      const i = +g.dataset.grip, j = e.key === 'ArrowUp' ? i - 1 : e.key === 'ArrowDown' ? i + 1 : -1;
      if(j < 0 || j >= FIELDS.length) return; e.preventDefault();
      flip(list, '.frow', () => { const [x] = FIELDS.splice(i, 1); FIELDS.splice(j, 0, x); saveD(); draw(); });
      $(`.flist [data-grip="${j}"]`, holder)?.focus(); }));
    $$('.frow', list).forEach(row => enableDrag(row, list));
  };
  const rename = i => {
    const f = FIELDS[i], row = $(`.frow[data-i="${i}"]`, holder), fl = $('.fl', row);
    fl.innerHTML = `<input class="fin" value="${esc(flabel(f))}" aria-label="${tx('Feldname','Field name')}"><small>Notion: ${esc(f.n)}</small>`;
    const inp = $('input', fl); inp.focus(); inp.select();
    let done = false;
    const end = ok => { if(done) return; done = true; if(ok){ const v = inp.value.trim(); f.l = v && v !== f.n ? v : ''; saveD(); } draw(); };
    inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); end(true); } if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); end(false); } });
    inp.addEventListener('blur', () => end(true));
  };
  // long-press (touch) or grip drag (mouse) to reorder
  function enableDrag(row, list){
    let timer, start, drag = false, rows, idx, to, h, pid;
    const begin = () => {
      drag = true; rows = $$('.frow', list); idx = rows.indexOf(row); to = idx; h = row.getBoundingClientRect().height;
      row.classList.add('lift'); list.classList.add('dragging'); navigator.vibrate?.(12);
    };
    const move = y => {
      const dy = y - start; row.style.transform = `translateY(${dy}px) scale(1.02)`;
      const r0 = rows[idx].offsetTop + dy + h/2;
      to = idx; rows.forEach((r, k) => { if(k === idx) return; const mid = r.offsetTop + r.offsetHeight/2;
        if(k > idx && r0 > mid) to = Math.max(to, k); if(k < idx && r0 < mid) to = Math.min(to, k); });
      rows.forEach((r, k) => { if(k === idx) return; const s = (k > idx && k <= to) ? -h : (k < idx && k >= to) ? h : 0; r.style.transform = s ? `translateY(${s}px)` : ''; });
    };
    const finish = () => {
      clearTimeout(timer);
      if(!drag) return; drag = false;
      row.classList.remove('lift'); list.classList.remove('dragging');
      rows.forEach(r => r.style.transform = '');
      if(to !== idx){ const [x] = FIELDS.splice(idx, 1); FIELDS.splice(to, 0, x); saveD(); draw(); }
    };
    row.addEventListener('pointerdown', e => {
      if(e.button > 0) return;
      const onGrip = !!e.target.closest('.grip'), onBtn = !!e.target.closest('button,input');
      if(onBtn && !onGrip) return;
      start = e.clientY; pid = e.pointerId;
      if(onGrip && e.pointerType === 'mouse'){ begin(); row.setPointerCapture(pid); e.preventDefault(); return; }
      timer = setTimeout(() => { begin(); try{ row.setPointerCapture(pid); }catch(x){} }, 380);
    });
    row.addEventListener('pointermove', e => { if(drag) move(e.clientY); else if(Math.abs(e.clientY - start) > 8) clearTimeout(timer); });
    row.addEventListener('pointerup', finish); row.addEventListener('pointercancel', finish);
    row.addEventListener('touchmove', e => { if(drag) e.preventDefault(); }, {passive:false});
    row.addEventListener('contextmenu', e => e.preventDefault());
  }
  draw();
}
